name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --extra train --extra bimanual --extra dev --torch-backend=cpu
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Environment doctor
        run: uv run mujoco-lab doctor
      - name: G1 model contract
        run: |
          uv run mujoco-lab inspect-robot g1 \
            --cache-root "$RUNNER_TEMP/mujoco_lab" \
            --output "$RUNNER_TEMP/g1-inspection.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "g1-inspection.json").read_text())
          assert report["articulated_joint_count"] == 29
          assert report["actuator_count"] == 29
          assert len(report["left_foot_contact_geom_ids"]) >= 4
          assert len(report["right_foot_contact_geom_ids"]) >= 4
          print(
              "validated G1",
              report["revision"],
              report["integrator"],
              report["timestep"],
          )
          PY
