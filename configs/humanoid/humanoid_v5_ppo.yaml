name: humanoid-v5-ppo

task:
  family: humanoid
  env_id: Humanoid-v5
  kwargs:
    terminate_when_unhealthy: true
    healthy_reward: 5.0
    forward_reward_weight: 1.25
    ctrl_cost_weight: 0.1

algorithm:
  name: ppo
  total_timesteps: 1000000
  seed: 42
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [256, 256]

runtime:
  n_envs: 4
  normalize_obs: true
  normalize_reward: true
  checkpoint_freq: 100000
  output_dir: runs/humanoid-v5-ppo
  device: auto  # CUDA -> MPS -> CPU
